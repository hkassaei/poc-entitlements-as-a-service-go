steps:
  # Step 1: Install dependencies — ECS
  - name: 'node:20-slim'
    entrypoint: 'npm'
    args: ['ci']
    id: 'install-ecs'

  # Step 2: Install dependencies — mock-hss
  - name: 'node:20-slim'
    entrypoint: 'npm'
    args: ['ci']
    dir: 'mock-hss'
    id: 'install-mock-hss'

  # Step 3: TypeScript compile — ECS
  - name: 'node:20-slim'
    entrypoint: 'npm'
    args: ['run', 'build']
    id: 'build-ecs'
    waitFor: ['install-ecs']

  # Step 4: TypeScript compile — mock-hss
  - name: 'node:20-slim'
    entrypoint: 'npm'
    args: ['run', 'build']
    dir: 'mock-hss'
    id: 'build-mock-hss'
    waitFor: ['install-mock-hss']

  # Step 5: Run unit tests
  - name: 'node:20-slim'
    entrypoint: 'npm'
    args: ['run', 'test:unit']
    id: 'test'
    waitFor: ['build-ecs']

  # Step 6: Build ECS Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/ecs:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/ecs:latest'
      - '.'
    id: 'docker-build-ecs'
    waitFor: ['test']

  # Step 7: Build mock-hss Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/mock-hss:${SHORT_SHA}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/mock-hss:latest'
      - 'mock-hss'
    id: 'docker-build-mock-hss'
    waitFor: ['build-mock-hss']

  # Step 8: Push ECS image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/ecs'
    id: 'push-ecs'
    waitFor: ['docker-build-ecs']

  # Step 9: Push mock-hss image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/mock-hss'
    id: 'push-mock-hss'
    waitFor: ['docker-build-mock-hss']

  # Step 10: Run database migrations via Cloud SQL Proxy
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Install Node.js for running migrations
        apt-get update && apt-get install -y nodejs npm
        npm ci
        npx tsx src/db/migrate.ts
    id: 'migrate'
    waitFor: ['push-ecs']
    secretEnv: ['DATABASE_URL']

  # Step 11: Deploy mock-hss to Cloud Run (must be up before ECS)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'services'
      - 'update'
      - 'mock-hss'
      - '--region=${_REGION}'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/mock-hss:${SHORT_SHA}'
    id: 'deploy-mock-hss'
    waitFor: ['push-mock-hss', 'migrate']

  # Step 12: Deploy ECS to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'services'
      - 'update'
      - 'entitlement-server'
      - '--region=${_REGION}'
      - '--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/ecs:${SHORT_SHA}'
    id: 'deploy-ecs'
    waitFor: ['deploy-mock-hss']

  # Step 13: Smoke test
  - name: 'gcr.io/cloud-builders/curl'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        ECS_URL=$(gcloud run services describe entitlement-server --region=${_REGION} --format='value(status.url)')
        echo "Testing health endpoint: $${ECS_URL}/health"
        curl -f "$${ECS_URL}/health" || exit 1
        echo "Smoke test passed."
    id: 'smoke-test'
    waitFor: ['deploy-ecs']

substitutions:
  _REGION: 'us-central1'
  _ARTIFACT_REPO: 'entitlements'

availableSecrets:
  secretManager:
    - versionName: 'projects/${PROJECT_ID}/secrets/database-url/versions/latest'
      env: 'DATABASE_URL'

options:
  logging: CLOUD_LOGGING_ONLY

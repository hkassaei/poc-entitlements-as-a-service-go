steps:
  # 1. Build & Test
  - name: 'node:20-slim'
    entrypoint: 'npm'
    args: ['ci']
    id: 'install'
  
  - name: 'node:20-slim'
    entrypoint: 'npm'
    args: ['run', 'build']
    id: 'build'
    waitFor: ['install']

  - name: 'node:20-slim'
    entrypoint: 'npm'
    args: ['run', 'test:unit']
    id: 'test'
    waitFor: ['build']

  # 2. Containerize
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/ecs:${SHORT_SHA}', '.']
    id: 'docker-build-ecs'
    waitFor: ['test']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/mock-hss:${SHORT_SHA}', 'mock-hss']
    id: 'docker-build-mock-hss'
    waitFor: ['test']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/ecs:${SHORT_SHA}']
    id: 'push-ecs'
    waitFor: ['docker-build-ecs']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/mock-hss:${SHORT_SHA}']
    id: 'push-mock-hss'
    waitFor: ['docker-build-mock-hss']

  # 3. Infrastructure Bootstrap (Declarative Intent)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if ! gcloud storage buckets describe gs://${_STATE_BUCKET} >/dev/null 2>&1; then
          echo "Creating Terraform state bucket: ${_STATE_BUCKET}"
          gcloud storage buckets create gs://${_STATE_BUCKET} --location=${_REGION} --uniform-bucket-level-access
        fi
    id: 'bootstrap-state-bucket'
    waitFor: ['-'] # Start in parallel with builds

  # 4. Terraform Deployment
  - name: 'hashicorp/terraform:1.5.7'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        cd ${_TERRAFORM_DIR}
        terraform init -backend-config="bucket=${_STATE_BUCKET}"
        terraform apply -auto-approve \
          -var="project_id=${PROJECT_ID}" \
          -var="state_bucket_name=${_STATE_BUCKET}" \
          -var="ecs_image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/ecs:${SHORT_SHA}" \
          -var="mock_hss_image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_ARTIFACT_REPO}/mock-hss:${SHORT_SHA}" \
          -var="environment=${_ENVIRONMENT}"
    id: 'terraform-apply'
    waitFor: ['push-ecs', 'push-mock-hss', 'bootstrap-state-bucket']

  # 5. Database Migrations
  - name: 'node:20-slim'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        npm ci
        npx tsx src/db/migrate.ts
    id: 'migrate'
    waitFor: ['terraform-apply']
    secretEnv: ['DATABASE_URL']

  # 6. Smoke Test
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        ECS_URL=$(gcloud run services describe entitlement-server --region=${_REGION} --format='value(status.url)')
        echo "Testing health endpoint: $${ECS_URL}/health"
        curl -f "$${ECS_URL}/health" || exit 1
    id: 'smoke-test'
    waitFor: ['migrate']

substitutions:
  _REGION: 'us-central1'
  _ARTIFACT_REPO: 'entitlements'
  _TERRAFORM_DIR: 'terraform'
  _ENVIRONMENT: 'dev'
  _STATE_BUCKET: '${PROJECT_ID}-terraform-state' # Deterministic bucket name

availableSecrets:
  secretManager:
    - versionName: 'projects/${PROJECT_ID}/secrets/${_ENVIRONMENT}-database-url/versions/latest'
      env: 'DATABASE_URL'

options:
  logging: CLOUD_LOGGING_ONLY
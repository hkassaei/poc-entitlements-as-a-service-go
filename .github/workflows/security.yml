name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly CodeQL scan — catches new vulnerability patterns
    - cron: "0 6 * * 1"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - uses: github/codeql-action/autobuild@v4

      - uses: github/codeql-action/analyze@v4

  gitleaks:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checkov:
    name: Infrastructure Security (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [terraform, terraform-devenv]
    steps:
      - uses: actions/checkout@v6

      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ matrix.dir }}/
          framework: terraform
          soft_fail: true
          output_format: cli
          quiet: true

  trivy:
    name: Container Scanning
    runs-on: ubuntu-latest
    # Only scan images on pushes to main (images aren't built on PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - context: "."
            image: ecs
          - context: mock-hss
            image: mock-hss
    steps:
      - uses: actions/checkout@v6

      - name: Build ${{ matrix.image }} image
        run: docker build -t ${{ matrix.image }}:scan ${{ matrix.context }}

      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ matrix.image }}:scan"
          severity: HIGH,CRITICAL
          exit-code: "0"
          format: table

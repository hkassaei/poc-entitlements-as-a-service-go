services:
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ecs
      POSTGRES_PASSWORD: password
      POSTGRES_DB: entitlements
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecs -d entitlements"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  ecs:
    build: .
    ports:
      - "8443:8443"
    environment:
      PORT: "8443"
      HOST: "0.0.0.0"
      DATABASE_URL: "postgresql://ecs:password@postgres:5432/entitlements"
      DB_POOL_SIZE: "5"
      REDIS_URL: "redis://redis:6379"
      HSS_URL: "http://mock-hss:3001"
      NODE_ENV: "development"
      SUPPORTED_VERSIONS: "2,4"
      OPERATOR_MCC: "001"
      OPERATOR_MNC: "01"
      OPERATOR_NAME: "TestOperator"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:

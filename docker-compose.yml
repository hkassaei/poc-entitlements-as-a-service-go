services:
  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ecs
      POSTGRES_PASSWORD: password
      POSTGRES_DB: entitlements
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecs -d entitlements"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mock-hss:
    build:
      context: .
      dockerfile: Dockerfile.mock-hss
    ports:
      - "3001:3001"
    environment:
      PORT: "3001"
      HOST: "0.0.0.0"
      DATABASE_URL: "postgresql://ecs:password@postgres:5432/entitlements"
      DB_POOL_SIZE: "5"
      LOCAL_KEK_HEX: "000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f"
    depends_on:
      postgres:
        condition: service_healthy

  ecs:
    build:
      context: .
      dockerfile: Dockerfile.ecs
    ports:
      - "8443:8443"
    environment:
      PORT: "8443"
      HOST: "0.0.0.0"
      DATABASE_URL: "postgresql://ecs:password@postgres:5432/entitlements"
      DB_POOL_SIZE: "5"
      REDIS_URL: "redis://redis:6379"
      HSS_URL: "http://mock-hss:3001"
      SUPPORTED_VERSIONS: "2,4"
      OPERATOR_MCC: "001"
      OPERATOR_MNC: "01"
      OPERATOR_NAME: "TestOperator"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mock-hss:
        condition: service_started

volumes:
  pgdata:
